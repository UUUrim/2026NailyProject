<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Naily 사이드뷰 카메라</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
  }
  #status {
    margin: 14px; padding: 8px 14px;
    background: rgba(0,0,0,0.55);
    border-radius: 10px;
    font-size: 15px;
    align-self: flex-start;
  }
  #status.connected { color: #7CFF7C; }
  #status.warn { color: #FFD54A; }
  #status.err { color: #FF6B6B; }
  #flash {
    position: absolute; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none;
    transition: opacity 120ms ease-out;
  }
  #flash.on { opacity: 0.85; }
  #bottom {
    margin: 18px; display: flex; justify-content: center;
    pointer-events: auto;
  }
  #manualBtn {
    padding: 14px 28px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 999px;
    background: rgba(255,255,255,0.14);
    color: #fff; backdrop-filter: blur(6px);
  }
  #manualBtn:active { background: rgba(255,255,255,0.3); }
  #startScreen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
  }
  #startBtn {
    padding: 16px 32px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 999px;
    background: #4ADE80; color: #06240f;
  }
  /* 초점/노출 지점 표시 + 설정 패널 */
  #focusRing {
    position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border: 2px solid #FFD54A; border-radius: 50%;
    pointer-events: none; display: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
  }
  #gearBtn {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 22px;
  }
  #panel {
    position: absolute; top: 64px; right: 12px; z-index: 5; width: 270px;
    background: rgba(0,0,0,0.78); border-radius: 12px; padding: 12px 14px;
    font-size: 14px; line-height: 1.5; display: none;
  }
  #panel label { display: block; margin-top: 8px; }
  #panel input[type=range] { width: 100%; }
  #panel small { color: #aaa; display: block; margin-top: 6px; }
  #panel button { margin-top: 8px; padding: 6px 10px; border-radius: 8px; border: none; background: #3a4150; color: #fff; }
</style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <div id="flash"></div>
  <div id="focusRing"></div>
  <button id="gearBtn" type="button" aria-label="카메라 설정">⚙</button>
  <div id="panel">
    <b>카메라 설정</b>
    <label>초점
      <select id="afMode" style="width:100%">
        <option value="poi">손가락 지점에 맞춤 (권장)</option>
        <option value="auto">자동</option>
        <option value="manual">수동 거리</option>
      </select>
    </label>
    <label id="fdRow" style="display:none">초점 거리 <span id="fdVal"></span>
      <input id="fd" type="range" min="0" max="1" step="0.01" value="0.5" />
    </label>
    <label id="evRow">노출 보정 <span id="evVal"></span>
      <input id="ev" type="range" min="-3" max="3" step="0.1" value="-1" />
    </label>
    <small id="capInfo"></small>
    <small>촬영할 때마다 서버가 손가락 위치를 자동으로 찾아 그 지점에 초점·노출을 맞춥니다. 자동 검출이 안 될 때만 화면에서 손톱 부근을 탭해 둔 지점을 씁니다.</small>
    <button id="applyBtn" type="button">지금 적용</button>
  </div>
  <div id="overlay">
    <div id="status">연결 대기 중...</div>
    <div id="bottom">
      <button id="manualBtn">지금 촬영</button>
    </div>
  </div>
  <div id="startScreen">
    <p>사이드뷰(옆모습) 카메라로 사용합니다.<br/>후면 카메라 권한을 허용해주세요.</p>
    <button id="startBtn">카메라 시작</button>
  </div>

<script>
(function () {
  "use strict";

  const video       = document.getElementById("video");
  const statusEl    = document.getElementById("status");
  const flashEl     = document.getElementById("flash");
  const manualBtn   = document.getElementById("manualBtn");
  const startScreen = document.getElementById("startScreen");
  const startBtn    = document.getElementById("startBtn");
  const ringEl      = document.getElementById("focusRing");
  const gearBtn     = document.getElementById("gearBtn");
  const panel       = document.getElementById("panel");
  const afModeEl    = document.getElementById("afMode");
  const fdRow       = document.getElementById("fdRow");
  const fdEl        = document.getElementById("fd");
  const fdVal       = document.getElementById("fdVal");
  const evEl        = document.getElementById("ev");
  const evVal       = document.getElementById("evVal");
  const capInfo     = document.getElementById("capInfo");
  const applyBtn    = document.getElementById("applyBtn");

  const PAGE_VERSION    = "cal3";   // shown in /phone/side/debug so the desktop can tell which page the phone is running
  const PREVIEW_MS      = 250;    // minimum gap between preview uploads (next one waits for the previous to finish)
  const POLL_MS         = 400;    // capture-request poll interval
  const PREVIEW_MAX_W   = 640;    // preview width sent to desktop (small, so it keeps up through ngrok)
  const FOCUS_SETTLE_MS = 1000;   // time given to a one-shot autofocus before it is locked / the photo is taken

  // The fingertip sits at almost the same place in this fixed rig, so the focus + exposure point is
  // stored on the phone. Default = roughly where the nail ends up in the phone's own (unrotated) frame;
  // tap the fingertip once on the live view to set it exactly.
  const DEFAULTS = { af: "poi", ev: -1.0, fd: null, point: { x: 0.47, y: 0.50 } };
  let cfg = loadCfg();

  let videoRetries  = 0;          // 영상이 안 시작됐을 때 카메라를 다시 연 횟수
  let stream        = null;
  let track         = null;
  let imageCapture   = null;
  let caps          = {};
  let previewTimer   = null;
  let sending        = false;     // true while a preview upload is in flight (no pile-up)
  let pollTimer      = null;
  let busy           = false;     // true while a full-res capture is in flight
  let serverFd       = null;      // manual focus distance found by the desktop's focus calibration
  let calibrating    = false;
  let autoPoint      = null;      // finger position the desktop server found in the latest preview (no tapping needed)

  function loadCfg() {
    try {
      const j = JSON.parse(localStorage.getItem("nailySide") || "null");
      if (j) {
        const c = Object.assign({}, DEFAULTS, j, { point: Object.assign({}, DEFAULTS.point, j.point || {}) });
        const ok = (v) => typeof v === "number" && isFinite(v) && v >= 0 && v <= 1;
        if (!ok(c.point.x) || !ok(c.point.y)) c.point = Object.assign({}, DEFAULTS.point);
        if (typeof c.ev !== "number" || !isFinite(c.ev)) c.ev = DEFAULTS.ev;
        return c;
      }
    } catch (e) { /* storage blocked: use defaults */ }
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
  function saveCfg() {
    try { localStorage.setItem("nailySide", JSON.stringify(cfg)); } catch (e) { /* ignore */ }
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  function flash() {
    flashEl.classList.add("on");
    setTimeout(() => flashEl.classList.remove("on"), 150);
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ── camera control ─────────────────────────────────────────────────────────
  // Unsupported "advanced" constraints are silently ignored by the browser (no error), so what was
  // actually applied is read back from track.getSettings() and reported to the desktop server.

  async function applyAdv(obj) {
    if (!track || !track.applyConstraints) return false;
    try { await track.applyConstraints({ advanced: [obj] }); return true; }
    catch (e) { return false; }
  }

  function has(list, v) { return Array.isArray(list) && list.indexOf(v) >= 0; }
  // focus/metering point: the server's live finger detection if it sent one, else the stored/tapped point
  function curPoint() { return autoPoint || cfg.point; }

  async function applyExposure() {
    // Metering on the (bright) finger instead of the dark box keeps the nail from being blown out,
    // and a negative compensation pulls the highlights further down so the nail edge keeps its contrast.
    const adv = {};
    if (caps.exposureMode && has(caps.exposureMode, "continuous")) {
      adv.exposureMode = "continuous";
      adv.pointsOfInterest = [curPoint()];
    }
    await applyAdv(adv);
    const c = caps.exposureCompensation;
    if (c && typeof c.min === "number") {
      const v = Math.max(c.min, Math.min(c.max, cfg.ev));
      await applyAdv({ exposureCompensation: v });
    }
  }

  function clampFd(v) {
    const fd = caps.focusDistance;
    return fd && typeof fd.min === "number" ? Math.max(fd.min, Math.min(fd.max, v)) : v;
  }

  async function applyFocus() {
    const fd = caps.focusDistance;
    const canManual = fd && typeof fd.min === "number" && has(caps.focusMode, "manual");
    // 1) a focus distance measured by the desktop's calibration (sharpest distance for the fingertip) wins
    if (serverFd != null && canManual) {
      await applyAdv({ focusMode: "manual", focusDistance: clampFd(serverFd) });
      return;
    }
    // 2) a distance chosen by hand with the slider
    if (cfg.af === "manual") {
      if (canManual) {
        const t = cfg.fd == null ? 0.5 : cfg.fd;
        await applyAdv({ focusMode: "manual", focusDistance: fd.min + (fd.max - fd.min) * t });
      }
      return;
    }
    if (cfg.af === "auto") {
      if (has(caps.focusMode, "continuous")) await applyAdv({ focusMode: "continuous" });
      return;
    }
    // 3) "poi": one-shot autofocus on the finger. Only possible when the phone exposes autofocus
    // (many Samsung browsers list "manual" as the ONLY mode - then the phone's own autofocus is left
    // alone, and the focus calibration is what fixes the distance). Never lock to a distance read back
    // from getSettings(): on such phones it is out of the allowed range (e.g. 10 vs max 0.61) and
    // pins the lens to infinity, which blurs the fingertip.
    if (has(caps.focusMode, "single-shot")) {
      await applyAdv({ focusMode: "single-shot", pointsOfInterest: [curPoint()] });
    } else if (has(caps.focusMode, "continuous")) {
      await applyAdv({ focusMode: "continuous", pointsOfInterest: [curPoint()] });
    } else {
      return;
    }
    await sleep(FOCUS_SETTLE_MS);
    const st = track.getSettings ? track.getSettings() : {};
    if (canManual && typeof st.focusDistance === "number" && st.focusDistance >= fd.min && st.focusDistance <= fd.max) {
      await applyAdv({ focusMode: "manual", focusDistance: st.focusDistance });
    }
  }

  // Focus calibration (started from the PC: open /phone/side/calibrate with a finger in the rig).
  // Sweeps the manual focus distance across the phone's range, uploads one frame per step, and the
  // server picks the sharpest fingertip. The result is kept on the server and sent back in /status.
  async function runCalibration(runId) {
    calibrating = true; busy = true;
    try {
      const fd = caps.focusDistance;
      if (!(fd && typeof fd.min === "number" && has(caps.focusMode, "manual"))) {
        setStatus("이 폰은 수동 초점을 지원하지 않아 보정할 수 없습니다", "err");
        await fetch("/phone/side/calib/done?run=" + runId, { method: "POST" });
        return;
      }
      const N = 14;
      const sweepStep = async (v, label) => {
        setStatus("초점 보정 " + label + " (움직이지 마세요)", "warn");
        await applyAdv({ focusMode: "manual", focusDistance: clampFd(v) });
        await sleep(900);
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;
        const c = document.createElement("canvas");
        c.width = vw; c.height = vh;
        c.getContext("2d").drawImage(video, 0, 0, vw, vh);
        const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
        if (blob) {
          try { await fetch("/phone/side/calib?run=" + runId + "&fd=" + clampFd(v), { method: "POST", body: blob }); }
          catch (e) { /* skip this step */ }
        }
      };
      // pass 1: coarse sweep over the phone's whole focus range
      for (let i = 0; i < N; i++) await sweepStep(fd.min + (fd.max - fd.min) * (i / (N - 1)), "1/2 " + (i + 1) + "/" + N);
      // pass 2: fine sweep around the coarse peak (the in-focus zone of a close-up lens is narrow)
      try {
        const pk = await (await fetch("/phone/side/calib/peek?run=" + runId, { method: "POST" })).json();
        if (pk && pk.best != null) {
          const step = (fd.max - fd.min) / (N - 1), M = 9;
          for (let j = 0; j < M; j++) await sweepStep(pk.best - step + 2 * step * (j / (M - 1)), "2/2 " + (j + 1) + "/" + M);
        }
      } catch (e) { /* the coarse result is still used */ }
      const r = await fetch("/phone/side/calib/done?run=" + runId, { method: "POST" });
      const j = await r.json();
      if (j && j.best != null) {
        serverFd = j.best;
        await applyAdv({ focusMode: "manual", focusDistance: clampFd(serverFd) });
        setStatus("초점 보정 완료: " + Number(j.best).toFixed(3), "connected");
      } else {
        setStatus("초점 보정 실패: " + ((j && j.message) || "선명한 지점을 못 찾음"), "err");
      }
    } catch (e) {
      setStatus("초점 보정 오류: " + e.message, "err");
    } finally {
      calibrating = false; busy = false;
    }
  }

  async function prepareCamera() {
    if (!track) return;
    await applyExposure();
    await applyFocus();
    reportCaps("prepare");
  }

  function reportCaps(why) {
    let settings = {};
    try { settings = track.getSettings ? track.getSettings() : {}; } catch (e) { /* ignore */ }
    const body = { why: why, ua: navigator.userAgent, caps: caps, settings: settings, cfg: cfg,
                   video: { w: video.videoWidth, h: video.videoHeight } };
    fetch("/phone/side/caps", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body) }).catch(() => {});
  }

  function describeCaps() {
    const bits = [];
    bits.push("초점 모드: " + (caps.focusMode ? caps.focusMode.join("/") : "지원 안 함"));
    bits.push("초점 거리: " + (caps.focusDistance ? "조절 가능" : "지원 안 함"));
    bits.push("노출 보정: " + (caps.exposureCompensation ? "조절 가능" : "지원 안 함"));
    capInfo.textContent = bits.join(" · ");
  }

  function syncPanel() {
    afModeEl.value = cfg.af;
    evEl.value = cfg.ev; evVal.textContent = Number(cfg.ev).toFixed(1);
    const fd = caps.focusDistance;
    fdRow.style.display = (cfg.af === "manual" && fd) ? "block" : "none";
    const t = cfg.fd == null ? 0.5 : cfg.fd;
    fdEl.value = t; fdVal.textContent = fd ? (fd.min + (fd.max - fd.min) * t).toFixed(2) : "";
    document.getElementById("evRow").style.display = caps.exposureCompensation ? "block" : "none";
    describeCaps();
  }

  gearBtn.addEventListener("click", () => {
    panel.style.display = panel.style.display === "block" ? "none" : "block";
    syncPanel();
  });
  afModeEl.addEventListener("change", () => { cfg.af = afModeEl.value; saveCfg(); syncPanel(); });
  fdEl.addEventListener("input", () => { cfg.fd = Number(fdEl.value); saveCfg(); syncPanel(); });
  evEl.addEventListener("input", () => { cfg.ev = Number(evEl.value); saveCfg(); syncPanel(); });
  applyBtn.addEventListener("click", async () => {
    setStatus("초점·노출 적용 중...", "warn");
    await prepareCamera();
    setStatus("적용 완료", "connected");
  });

  // tap on the live view -> focus/exposure point (undo object-fit:cover cropping to get frame coords)
  video.addEventListener("click", async (e) => {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const r = video.getBoundingClientRect();
    if (!r.width || !r.height) return;   // not laid out (e.g. hidden tab) - nothing sensible to compute
    const s = Math.max(r.width / vw, r.height / vh);
    const dw = vw * s, dh = vh * s;
    const offX = (dw - r.width) / 2, offY = (dh - r.height) / 2;
    const fx = (e.clientX - r.left + offX) / dw, fy = (e.clientY - r.top + offY) / dh;
    cfg.point = { x: Math.max(0, Math.min(1, fx)), y: Math.max(0, Math.min(1, fy)) };
    saveCfg();
    ringEl.style.left = (e.clientX - r.left) + "px"; ringEl.style.top = (e.clientY - r.top) + "px";
    ringEl.style.display = "block";
    setStatus("초점 지점 설정 중...", "warn");
    await prepareCamera();
    setStatus("초점 지점 설정됨", "connected");
    setTimeout(() => { ringEl.style.display = "none"; }, 1500);
  });

  // ── capture ───────────────────────────────────────────────────────────────
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width:  { ideal: 1920 },
          height: { ideal: 1080 },
        },
      });
    } catch (e) {
      setStatus("카메라 권한이 필요합니다: " + e.message, "err");
      return;
    }

    video.srcObject = stream;
    // 일부 폰 브라우저(삼성 인터넷 등)는 autoplay 만으로는 영상이 시작되지 않아 videoWidth 가 0 인 채로
    // 화면이 검고 프리뷰 전송도 멈춘다(서버에는 프레임 0장). 명시적으로 재생을 요청하고, 3초 안에도
    // 영상 크기가 안 잡히면 카메라를 껐다가 다시 열어 본다(최대 2번).
    try { await video.play(); } catch (e) { /* autoplay 정책: 아래 재시도로 처리 */ }
    track = stream.getVideoTracks()[0];
    try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) { caps = {}; }

    if (window.ImageCapture) {
      try { imageCapture = new ImageCapture(track); }
      catch (e) { imageCapture = null; }
    }

    startScreen.style.display = "none";
    setStatus("프리뷰 전송 중...", "connected");
    setTimeout(async () => {
      if (video.videoWidth || videoRetries >= 2) return;
      videoRetries += 1;
      setStatus("카메라 영상이 안 나와 다시 시도합니다 (" + videoRetries + "/2)", "err");
      clearInterval(previewTimer); clearInterval(pollTimer);
      try { stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ }
      video.srcObject = null;
      await startCamera();
    }, 3000);
    previewTimer = setInterval(sendPreview, PREVIEW_MS);
    pollTimer    = setInterval(pollCapture, POLL_MS);
    reportCaps("start");
    prepareCamera();
  }

  function previewCanvas() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const scale = Math.min(1, PREVIEW_MAX_W / vw);
    const c = document.createElement("canvas");
    c.width  = Math.round(vw * scale);
    c.height = Math.round(vh * scale);
    const ctx = c.getContext("2d");
    ctx.drawImage(video, 0, 0, c.width, c.height);
    return c;
  }

  function sendPreview() {
    if (sending) return;
    if (busy) return;
    const c = previewCanvas();
    if (!c) return;
    c.toBlob((blob) => {
      if (!blob) return;
      sending = true;
      fetch("/phone/side/frame", { method: "POST", body: blob,
            signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined })
        .then(() => setStatus("연결됨 - 라이브 프리뷰 전송 중", "connected"))
        .catch(() => setStatus("서버 연결 실패 - 같은 Wi-Fi인지 확인하세요", "err"))
        .finally(() => { sending = false; });
    }, "image/jpeg", 0.85);
  }

  async function pollCapture() {
    if (busy) return;
    let wanted = false;
    try {
      const r = await fetch("/phone/side/status?v=" + PAGE_VERSION + "&b=" + (busy ? 1 : 0) + "&c=" + (calibrating ? 1 : 0) +
                            "&txt=" + encodeURIComponent(statusEl.textContent.slice(0, 60)), { cache: "no-store" });
      const j = await r.json();
      wanted = !!j.capture;
      if (typeof j.fd === "number") serverFd = j.fd;
      if (j.calibrate && !calibrating) { runCalibration(j.calibrate); return; }
      if (wanted && j.point && typeof j.point.x === "number" && typeof j.point.y === "number") autoPoint = j.point;
    } catch (e) {
      setStatus("서버 연결 실패 - 같은 Wi-Fi인지 확인하세요", "err");
      return;
    }
    if (wanted) await takeAndUploadPhoto();
  }

  async function takeAndUploadPhoto() {
    busy = true;
    setStatus("초점 맞추는 중...", "warn");
    try {
      // refocus on the finger right before the shot (the previous finger may have sat at another distance)
      try { await prepareCamera(); } catch (e) { /* shoot anyway */ }
      setStatus("고화질 촬영 중...", "warn");
      flash();
      let blob = null;
      if (imageCapture) {
        try { blob = await imageCapture.takePhoto({ fillLightMode: "off" }); }
        catch (e) {
          try { blob = await imageCapture.takePhoto(); } catch (e2) { blob = null; }
        }
      }
      if (!blob) {
        // Fallback for browsers without ImageCapture (e.g. iOS Safari):
        // snapshot the live video frame at its native resolution.
        const vw = video.videoWidth, vh = video.videoHeight;
        const c = document.createElement("canvas");
        c.width = vw; c.height = vh;
        c.getContext("2d").drawImage(video, 0, 0, vw, vh);
        blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.92));
      }
      await fetch("/phone/side/photo", { method: "POST", body: blob });
      setStatus("촬영 완료 - 전송됨", "connected");
    } catch (e) {
      setStatus("촬영 실패: " + e.message, "err");
    } finally {
      busy = false;
    }
  }

  manualBtn.addEventListener("click", () => { if (!busy) takeAndUploadPhoto(); });
  startBtn.addEventListener("click", startCamera);

  // iOS Safari requires a user gesture before camera access even shows the
  // permission prompt reliably, so camera start waits for the button tap
  // rather than firing on page load.
})();
</script>
</body>
</html>
